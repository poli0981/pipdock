[package]
name = "pipdock-app"
description = "PipDock — Tauri shell. Commands and events only; all logic lives in pipdock-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "pipdock_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pipdock-core = { path = "../crates/pipdock-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Scoped in capabilities/external-links.json: the legal gate and the bug-report deep
# link hand a URL to the browser, because the CSP forbids the webview fetching it.
tauri-plugin-opener = "2"
# Write-only, for "Copy full log" (ERROR-CATALOG §4).
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2.35"
tokio = { version = "1", features = ["rt-multi-thread"] }
# `plan_cancel` trips the same `CancellationToken` the core threads through `exec`.
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
