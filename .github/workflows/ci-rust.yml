# Project-local: the ops repo (poli0981/.github) has no reusable Rust workflow, and only its
# desktop-csharp reusable runs on Windows. See docs/RELEASE-CI.md §1.
#
# Windows runner because the environment-discovery module reads the PEP 514 registry and the `py`
# launcher — a Linux run would skip exactly the code most likely to break.

name: CI / Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the exact version, so no toolchain action is needed — rustup
      # honours it on first invocation and installs rustfmt and clippy with it.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # cargo-audit only reads Cargo.lock, so it runs under the runner's stable cargo rather than
      # making rustup install the toolchain rust-toolchain.toml pins — that pin exists to make
      # PipDock reproducible, not its tooling.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A prebuilt cargo-audit, pinned by commit. This replaced rustsec/audit-check@v2, which ran
      # on Node 20, needed a check-run write token, and on a pull request failed only on
      # "critical" — so the advisories that turned `main` red in September passed every PR.
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      # RustSec advisories against the committed Cargo.lock. `--deny warnings`, because
      # .cargo/audit.toml's contract is that a *new* informational advisory fails CI and is looked
      # at; the known ones are ignored there one by one, with reasons.
      - name: Audit
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny

      # Licences, sources and bans — deny.toml says why each. Advisories stay cargo audit's.
      - name: Licences, sources, bans
        run: cargo deny --locked check licenses sources bans
