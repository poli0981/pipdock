# CodeQL, project-local since the move to poli0981org (2026-11-21).
#
# It was a caller into the owner's personal ops repo (`poli0981/.github`'s reusable-codeql.yml, at
# `@main`), whose steps used `github/codeql-action@v4` by tag. The same analysis runs here with the
# action pinned by commit, and the write permission on the one job that uploads.
#
# Three languages, all `build-mode: none`. **Rust** — CodeQL analyses it without a build; this
# file said for six releases that CodeQL had no Rust support, which stopped being true in 2025.
# **Actions** — the workflows themselves: write permissions at workflow level, unpinned
# third-party actions, untrusted input in a `run:`. **JavaScript/TypeScript** — the frontend, and
# a required check under exactly the name `Analyze (javascript-typescript)` (RELEASE-CI.md §2).
# The `category` values are the reusable's, so existing alerts keep their history.
#
# Settings → Advanced Security → CodeQL "Default setup" must stay disabled, or this advanced
# setup is rejected at upload time.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, offset off the hour to avoid the top-of-hour scheduling pileup.
    - cron: '37 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read # CodeQL's own query packs
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
