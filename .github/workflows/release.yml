# Project-local: the ops repo has no reusable Tauri/build workflow (docs/RELEASE-CI.md §1).
#
# Produces the NSIS .exe and .msi, publishes SHA256SUMS.txt and leaves a DRAFT release for owner
# review. Publishing is manual on purpose — RELEASE-CI.md §3.4 — and announce-release.yml fires on
# `release: published`.
#
# PipDock does not update itself, so there is no signing key and no `latest.json` here. Users get
# new versions from the GitHub Releases page. The checksums below are what they verify against.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for re-runs)
        required: true
        type: string

permissions:
  contents: write # release assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build · checksum · draft
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install frontend dependencies
        run: npm ci

      # No separate frontend or CLI step: `tauri build` runs `beforeBuildCommand`, which is
      # `npm run build && npm run bundle:cli`. Keeping them there rather than here is what makes a
      # locally built installer identical to a released one — a bundle that differs by who built
      # it is how "works on my machine" reaches a release.
      - name: Build and bundle
        # `--locked` is **cargo's** flag, not `tauri build`'s: everything after `--` is passed
        # to the runner. Written the other way round it fails with "unexpected argument
        # '--locked' found" before a single crate is compiled — and since no `v*` tag has ever
        # been pushed, this workflow had never run to find out.
        run: npx tauri build --bundles nsis,msi -- --locked

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "release-artifacts"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem -Recurse target\release\bundle -Include *.exe, *.msi |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out

      - name: Publish checksums
        shell: pwsh
        run: |
          # SmartScreen warns on first run because the binaries are not EV-code-signed, so the
          # README tells users to verify these instead (docs/SECURITY.md §5).
          Get-ChildItem release-artifacts -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content release-artifacts\SHA256SUMS.txt -Encoding ascii
          Get-Content release-artifacts\SHA256SUMS.txt

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true # owner reviews, then publishes; publishing triggers the announcement
          generate_release_notes: true
          files: release-artifacts/*
