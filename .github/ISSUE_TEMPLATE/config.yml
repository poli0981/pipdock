# RELEASE-CI.md §5: blank issues disabled so every report carries the fields the triage flow and
# the in-app "Report bug" deep link depend on (ERROR-CATALOG §4).
blank_issues_enabled: false

contact_links:
  - name: Feature request — not accepted during maintenance
    url: https://github.com/poli0981org/pipdock/blob/main/CONTRIBUTING.md#scope-in-maintenance-mode
    about: Since 1.6.0 PipDock takes fixes, not features. An issue or pull request asking for one is closed automatically; this explains what is accepted, and where to argue that something is truly necessary.
  - name: Question or idea
    url: https://github.com/poli0981org/pipdock/discussions
    about: Ask about usage or share a workflow. Ideas are welcome to discuss, but during maintenance they are not on a roadmap.
  - name: Security vulnerability
    url: https://github.com/poli0981org/pipdock/security/advisories/new
    about: Report privately via GitHub Security Advisories. Please do not open a public issue.
