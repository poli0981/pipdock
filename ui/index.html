<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No Content-Security-Policy here, on purpose. A release build gets tauri.conf.json's
      `app.security.csp`, which Tauri injects; `npm run dev` gets `devCsp` from the same file,
      injected by vite.config.ts. Both live in one place, and the weaker one never ships.
    -->
    <title>PipDock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
