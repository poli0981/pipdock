[package]
name = "pipdock-cli"
description = "The `pipdock` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pipdock"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
pipdock-core = { path = "../pipdock-core" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
# `filters` gives `Settings::add_filter`, used to keep the crate version out of the help
# snapshots so a release bump does not churn every golden in tests/golden.rs.
insta = { version = "1.49.0", features = ["filters"] }
