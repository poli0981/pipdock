[package]
name = "pipdock-core"
description = "Domain logic for PipDock: engine adapters, planning, snapshots, dependency graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `fixtures.rs`: the L3 payloads xtask writes for the frontend's tests.
fixtures = []

[dependencies]
async-trait = "0.1.92"
jiff = { version = "0.2.38", features = ["serde"] }
nucleo = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "gzip", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# `fs`: an async fn that touches a file goes through tokio's pool rather than blocking a runtime
# worker (SonarQube rust:S7493).
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
# First-party tokio, for CancellationToken. The alternative was an AtomicBool plus a Notify,
# which is what CancellationToken already is, written worse.
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
jiff = "0.2.38"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# Cancelling a build has to reach the compilers `python -m pip` spawns, not just pip itself, and
# on Windows that means a Job Object. A safe wrapper rather than hand-written unsafe, because
# `unsafe_code = "forbid"` in the workspace lints is absolute and worth keeping that way.
win32job = "2.0.3"
