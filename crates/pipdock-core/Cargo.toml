[package]
name = "pipdock-core"
description = "Domain logic for PipDock: engine adapters, planning, snapshots, dependency graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.91"
nucleo = "0.5.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "gzip", "charset"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
